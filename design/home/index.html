<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merkorn · Logo 3D</title>
<meta name="robots" content="noindex">
<style>
html, body { margin: 0; height: 100%; background: #08070B; overflow: hidden; }
#obj { position: fixed; left: 50%; top: 50%; width: min(90vmin, 900px); aspect-ratio: 1; translate: -50% -50%; cursor: grab; }
#obj::before { content: ""; position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(circle, rgba(151,71,255,.22), rgba(151,71,255,.06) 45%, transparent 70%); filter: blur(10px); pointer-events: none; }
#obj canvas { position: relative; display: block; width: 100% !important; height: 100% !important; }
#obj.drag { cursor: grabbing; }
</style>
</head>
<body>
<div id="obj" aria-label="Logo Merkorn in 3D"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* Merkorn mark in 3D: five cubes made of particles, thin edges and glowing corners */
(() => {
  const box = document.getElementById('obj');
  if (!box || !window.THREE) return;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true }); } catch (e) { return; }
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  box.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, 1, .1, 100);
  camera.position.set(0, 0, 13);

  // round soft sprite for the points
  const spr = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const g = c.getContext('2d'), gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.25, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    return new THREE.CanvasTexture(c);
  })();

  // block positions of the mark: one on top, two in the middle, two at the bottom
  const S = 1, gx = 1.1, gy = 1.12;
  const cells = [[2, 0], [1, 1], [3, 1], [0, 2], [4, 2]];
  const group = new THREE.Group(); scene.add(group);
  const cubes = [];
  const white = new THREE.Color('#F2EFEA'), vio = new THREE.Color('#C9A2FF'), deep = new THREE.Color('#9747FF');

  cells.forEach(([cx, cy], k) => {
    const cube = new THREE.Group();
    cube.position.set((cx - 2) * gx, (1 - cy) * gy, 0);
    // particles filling the volume, denser near the faces
    const n = 3200, pos = new Float32Array(n * 3), col = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) {
      let p = [Math.random() - .5, Math.random() - .5, Math.random() - .5];
      if (Math.random() < .55) { const ax = i % 3; p[ax] = Math.sign(p[ax] || 1) * (.5 - Math.random() * .04); }
      pos.set(p.map(v => v * S), i * 3);
      const c = Math.random() < (k === 0 ? .35 : .12) ? vio : white;
      const f = .45 + Math.random() * .75;
      col.set([c.r * f, c.g * f, c.b * f], i * 3);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    cube.add(new THREE.Points(g, new THREE.PointsMaterial({ size: .06, map: spr, vertexColors: true, transparent: true, opacity: 1, depthWrite: false, blending: THREE.AdditiveBlending })));
    // edges
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(S, S, S)), new THREE.LineBasicMaterial({ color: k === 0 ? deep : white, transparent: true, opacity: k === 0 ? .85 : .42, blending: THREE.AdditiveBlending }));
    cube.add(e);
    // glowing corners
    const cp = [];
    for (const x of [-.5, .5]) for (const y of [-.5, .5]) for (const z of [-.5, .5]) cp.push(x * S, y * S, z * S);
    const cg = new THREE.BufferGeometry(); cg.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3));
    cube.add(new THREE.Points(cg, new THREE.PointsMaterial({ size: .3, map: spr, color: k === 0 ? vio : white, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending })));
    cube.userData.phase = k * 1.3;
    group.add(cube); cubes.push(cube);
  });

  // faint dust around the mark
  {
    const n = 900, pos = new Float32Array(n * 3);
    for (let i = 0; i < n; i++) pos.set([(Math.random() - .5) * 8, (Math.random() - .5) * 6, (Math.random() - .5) * 4], i * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: .03, map: spr, color: '#A7A2AE', transparent: true, opacity: .45, depthWrite: false, blending: THREE.AdditiveBlending })));
  }

  const size = () => { const w = box.clientWidth, h = box.clientHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix(); };
  size(); addEventListener('resize', size);

  // drag to turn, otherwise it turns by itself
  let dragX = 0, dragY = 0, vx = 0, vy = 0, down = null;
  box.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; box.classList.add('drag'); box.setPointerCapture(e.pointerId); });
  box.addEventListener('pointermove', e => { if (!down) return; vx = (e.clientX - down[0]) * .006; vy = (e.clientY - down[1]) * .006; dragY += vx; dragX += vy; down = [e.clientX, e.clientY]; });
  const up = () => { down = null; box.classList.remove('drag'); };
  box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);

  const t0 = performance.now();
  const frame = now => {
    const t = (now - t0) / 1000;
    if (!down) { dragY += vx; dragX += vy; vx *= .94; vy *= .94; }
    group.rotation.y = Math.sin(t * .35) * .9 + t * .12 + dragY;
    group.rotation.x = Math.sin(t * .27) * .35 - .15 + dragX;
    group.rotation.z = Math.sin(t * .2) * .12;
    cubes.forEach(c => { c.position.z = Math.sin(t * .9 + c.userData.phase) * .18; c.rotation.y = Math.sin(t * .6 + c.userData.phase) * .12; });
    renderer.render(scene, camera);
    if (!reduce) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
